name: Publish architecture gallery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-architecture-pages.yml"
      - "docs/index.html"
      - "docs/architecture/*.html"
      - "docs/ux/*.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Stage documentation site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/architecture _site/ux
          cp docs/index.html _site/index.html
          cp docs/architecture/*.html _site/architecture/
          cp docs/ux/*.html _site/ux/
          touch _site/.nojekyll

          source_count="$(find docs/architecture -maxdepth 1 -type f -name '*.html' | wc -l)"
          staged_count="$(find _site/architecture -maxdepth 1 -type f -name '*.html' | wc -l)"
          test "$source_count" -eq "$staged_count"
          test -f _site/index.html
          test -f _site/architecture/index.html
          test -f _site/ux/vision-search-ux.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
