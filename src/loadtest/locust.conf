# Locust run configuration — controls the load *size*.
# Override any value on the CLI (e.g. `locust --users 50`) or via the
# Azure Load Testing configuration. Start small; scale up later.

locustfile = locustfile.py

# Number of concurrent simulated users.
users = 10

# New users started per second until `users` is reached.
spawn-rate = 2

# Total test duration (e.g. 30s, 2m, 1h).
run-time = 1m

# Run without the web UI so the same config works locally and in CI/ALT.
headless = true

# Emit a CSV summary (vision-search_stats.csv, _failures.csv, etc.).
csv = vision-search

# Host is intentionally omitted here — supply it at runtime with
# `--host https://<target>` so this file stays deployment-agnostic.
